name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -q '材料概论双语刷词_GitHub自动构建版.zip' -d source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: source/materials_vocab_github_final
        run: gradle --no-daemon assembleDebug
      - name: Name APK
        run: cp source/materials_vocab_github_final/app/build/outputs/apk/debug/app-debug.apk '材料概论双语刷词-v1.0.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: materials-vocab-apk
          path: 材料概论双语刷词-v1.0.apk
          if-no-files-found: error
